[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "npm ci || npm install",
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link || true; php artisan optimize:clear; php artisan optimize || true; php artisan serve --host=0.0.0.0 --port=${PORT:-80}"
